<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#110a0b;background-image:radial-gradient(ellipse 700px 500px at 22% 50%,rgba(179,32,42,.45),transparent 70%),radial-gradient(ellipse 600px 400px at 100% 0%,rgba(212,169,79,.10),transparent 60%);font-family:Manrope,sans-serif;color:#efe6dc;position:relative}
.frame{position:absolute;inset:22px;border:1px solid rgba(212,169,79,.55);outline:1px solid rgba(212,169,79,.25);outline-offset:6px}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:64px;padding:0 90px}
.icon-wrap{flex-shrink:0;filter:drop-shadow(0 0 50px rgba(226,81,90,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.6))}
.icon{display:block;width:340px;height:340px;clip-path:circle(49.5%)}
.eyebrow{font-size:26px;color:#e2515a;letter-spacing:.06em;margin-bottom:14px}
h1{font-family:Cinzel,serif;font-weight:700;font-size:88px;line-height:1;white-space:nowrap;letter-spacing:.02em;color:#efe6dc;text-shadow:0 2px 0 #000}
.tag{font-family:Cinzel,serif;font-weight:600;font-size:34px;color:#ecca7a;text-wrap:balance;line-height:1.3;margin:18px 0 34px}
.rule{height:1px;width:520px;background:linear-gradient(90deg,#d4a94f,transparent);margin-bottom:28px}
.meta{font-size:26px;color:#b5a4a1;display:flex;gap:30px}
.meta b{color:#efe6dc;font-weight:600}
</style></head><body>
<div class="frame"></div>
<div class="wrap">
  <div class="icon-wrap"><img class="icon" src="../docs/img/buadren-icon.png" alt=""></div>
  <div>
    <div class="eyebrow">ASHERON'S CALL · ACE · PvE</div>
    <h1>Buadren AC</h1>
    <div class="tag">Dereth never stopped calling us home.</div>
    <div class="rule"></div>
    <div class="meta"><span><b>gs1.buadren.com:9000</b></span><span>www.buadren.com</span></div>
  </div>
</div>
</body></html>
